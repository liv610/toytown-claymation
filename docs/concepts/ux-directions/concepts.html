<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UX Direction Concepts</title>
<!-- Static visual concepts only (no behaviour), drawn over real renders of the current felt map (render.js).
     Open with ?s=A_desktop_landing … B_phone_details. Content is the prototype's existing text and fictional campaign. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  :root {
    --night: #17142a; --panel: #221c3e; --panel-2: #2a2350; --ink: #f6ecda; --muted: #cdbfa9; --line: rgba(246, 236, 218, 0.16);
    --gold: #f2b85c; --holly: #c4372c; --on-holly: #fff8ee; --ok: #bfe3a8;
    --display: "Fraunces", Georgia, serif; --body: "Atkinson Hyperlegible", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--night); color: var(--ink); font: 400 15px/1.45 var(--body); overflow: hidden; position: relative; }
  .abs { position: absolute; }
  img.map { position: absolute; display: block; object-fit: cover; }
  button, .btn { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: default; }
  /* shared pieces */
  .brand { font: 600 19px/1 var(--display); letter-spacing: 0.01em; }
  .proto { font: 700 10.5px/1 var(--body); letter-spacing: 0.09em; text-transform: uppercase; color: #2a1606; background: var(--gold); padding: 4px 7px; border-radius: 5px; }
  .tag { display: inline-block; font: 700 10px/1 var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: #2a1606; background: var(--gold); padding: 3px 6px 3px; border-radius: 4px; rotate: -2deg; outline: 1px dashed rgba(42, 22, 6, 0.45); outline-offset: -3px; vertical-align: 2px; }
  .act { border: 1px solid var(--line); background: rgba(246, 236, 218, 0.06); border-radius: 999px; padding: 7px 13px; font-weight: 700; font-size: 13.5px; white-space: nowrap; }
  .act.primary { background: var(--holly); border-color: var(--holly); color: var(--on-holly); }
  .pbtn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--holly); color: var(--on-holly); border-radius: 999px; font-weight: 700; padding: 11px 18px; }
  .sbtn { display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 999px; font-weight: 700; padding: 10px 16px; background: rgba(23, 20, 42, 0.6); }
  .field { background: var(--ink); color: #6e6458; border-radius: 12px; font: 700 16px/1 var(--body); letter-spacing: 0.06em; display: flex; align-items: center; padding: 0 14px; }
  .felt { background: var(--panel); border: 1px solid rgba(242, 184, 92, 0.32); box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45); outline: 1.5px dashed rgba(242, 184, 92, 0.42); outline-offset: -7px; }
  .muted { color: var(--muted); } .fine { color: var(--muted); font-size: 12.5px; }
  .ok { color: var(--ok); font-weight: 700; font-size: 13.5px; }
  .h { font: 600 18px/1.2 var(--display); margin: 0; }
  .link { color: var(--gold); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  .zipchip { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .zipchip b { color: var(--ink); letter-spacing: 0.05em; }
  .stitch-rule { border: 0; border-top: 1.5px dashed var(--line); margin: 12px 0; }
  /* map labels, restyled the same in both directions: Toy Town leads, Maple Hollow is a quieter story stop */
  .lbl { position: absolute; translate: -50% -100%; white-space: nowrap; border-radius: 999px; font-weight: 700; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45); }
  .lbl::after { content: ""; position: absolute; left: 50%; bottom: -6px; translate: -50% 0; border: 6px solid transparent; border-bottom: 0; }
  .lbl.tt { background: #2a2242; border: 1px solid var(--gold); color: var(--gold); padding: 7px 13px; font-size: 14px; }
  .lbl.tt::after { border-top-color: var(--gold); }
  .lbl.mh { background: rgba(23, 20, 42, 0.82); color: var(--ink); padding: 5px 10px 5px 9px; font-size: 12px; border: 1px solid rgba(246, 236, 218, 0.25); }
  .lbl.mh::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--holly); margin-right: 6px; vertical-align: 1px; }
  .lbl.mh::after { border-top-color: rgba(23, 20, 42, 0.82); }
  .lbl small { font-weight: 400; color: var(--muted); margin-left: 4px; }
  .note { position: absolute; font-size: 11.5px; color: var(--muted); text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9); }
</style>
</head>
<body>
<script>
// ------------------------------------------------------------------ content (all existing prototype text)
const C = {
  caption: 'A miniature United States, sewn in felt. Three symbolic lines connect communities across the country.',
  note: 'Felt map from US Census boundaries (public domain). Mountains placed by real latitude and longitude, heights exaggerated. Towns are generic; Maple Hollow is fictional.',
  name: 'Copper Wash Toy Drive', zip: '00201', area: 'Copper Wash and the canyon communities', based: 'Copper Wash, Arizona',
  fictional: 'Fictional campaign for testing. Its link goes to example.org, a placeholder address.',
};
const S = new URLSearchParams(location.search).get('s') || 'A_desktop_landing';
const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; };
const add = (html, parent = document.body) => parent.appendChild(h(html));
let A = null;
// the map image of a render, placed at (x, y) on the screen, with its labels re-drawn at the recorded anchors
function map(name, x = 0, y = 0, { labels = true } = {}) {
  const a = A[name];
  add(`<img class="map" src="renders/${name}.jpg" style="left:${x}px;top:${y}px;width:${a.w}px;height:${a.h}px" alt="">`);
  if (!labels) return a;
  const inside = (p) => p && p.x > 20 && p.x < a.w - 20 && p.y > 40 && p.y < a.h - 10;
  if (inside(a.toytown)) add(`<div class="lbl tt" style="left:${x + a.toytown.x}px;top:${y + a.toytown.y}px">★ Toy Town</div>`);
  if (inside(a.maple)) add(`<div class="lbl mh" style="left:${x + a.maple.x}px;top:${y + a.maple.y}px">Maple Hollow<small>Chapter 1</small></div>`);
  return a;
}
const searchRow = (w = '100%', fh = 44) => `<div style="display:flex;gap:8px;width:${w}"><div class="field" style="flex:1;height:${fh}px">12345</div><span class="pbtn" style="height:${fh}px;padding:0 16px">Search</span></div>`;

const screens = {

    add(`<div class="abs" style="left:50%;translate:-50% 0;bottom:18px;display:flex;gap:10px;align-items:center"><span class="sbtn">Visit Maple Hollow</span><span class="fine" style="text-shadow:0 1px 6px #000">Drag to move · scroll or pinch to zoom</span></div>`);

    add(`<div class="abs" style="left:0;right:0;top:392px;bottom:0;background:var(--panel);border-top:1px solid rgba(242,184,92,.35);padding:14px 16px">
      <div style="display:flex;align-items:center;justify-content:space-between"><span class="zipchip">ZIP <b>${C.zip}</b> · <span class="link">Change</span></span><span class="tag">Test data</span></div>
      <p class="h" style="font-size:20px;margin-top:12px">${C.name}</p>
      <p class="ok" style="margin:5px 0 12px">Serves ZIP code ${C.zip}</p>
      <dl style="display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 14px;font-size:14px"><dt class="muted">Area served</dt><dd style="margin:0">${C.area}</dd><dt class="muted">Based in</dt><dd style="margin:0">${C.based}</dd></dl>
      <span class="pbtn" style="width:100%">Visit the campaign’s website</span>
      <p class="fine" style="margin:10px 0 6px">${C.fictional}</p>
      <p style="margin:0;text-align:center"><span class="link">Show less ▴</span></p>
      ${this._Bhelp()}</div>`);
  },
};

fetch('renders/anchors.json').then((r) => r.json()).then((a) => { A = a; screens[S].call(screens); document.body.dataset.ready = '1'; });
</script>
