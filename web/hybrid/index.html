<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toy Town — Hybrid Viewer</title>
<style>
  :root { --ink: #f6ead6; --panel: rgba(24, 14, 20, .55); }
  html, body { margin: 0; height: 100%; background: #0d0a10; overflow: hidden; font: 13px/1.45 system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  canvas.hot { cursor: pointer; }
  #hud { position: fixed; left: 12px; top: 10px; color: var(--ink); background: var(--panel);
         padding: 8px 10px; border-radius: 8px; pointer-events: none; white-space: pre; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--ink); font-size: 16px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading">Lighting the lamps…</div>
<div id="hud"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
