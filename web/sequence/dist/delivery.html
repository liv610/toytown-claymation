<title>Toy Town: The Delivery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Layout: full-bleed film frame; a quiet transport bar along the bottom like a projectionist's console. */
  :root {
    --night: #0f0b12;
    --bar: rgba(20, 13, 19, 0.74);
    --ink: #f4e7d2;
    --muted: #c4b19b;
    --ember: #f0a54a;
    --line: rgba(244, 231, 210, 0.16);
    --display: "Marcellus", "Georgia", serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--night); color: var(--ink); font-family: var(--body); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100% !important; height: 100% !important; display: block; touch-action: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 5; background: var(--night);
             font: 400 1.2rem/1.4 var(--display); letter-spacing: 0.04em; color: var(--muted); text-align: center; }
  #title { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 2; opacity: 0; }
  #title div { text-align: center; text-shadow: 0 2px 24px rgba(0, 0, 0, 0.55); }
  #title h1 { margin: 0; font: 400 clamp(2.2rem, 6vw, 4.2rem)/1 var(--display); letter-spacing: 0.03em; }
  #title p { margin: 10px 0 0; font: 500 0.78rem/1 var(--body); letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
  .bar {
    position: fixed; z-index: 3; left: 0; right: 0; bottom: 0;
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background: linear-gradient(to top, var(--bar), rgba(20, 13, 19, 0.0));
    display: grid; gap: 8px; transition: opacity 0.4s;
  }
  .bar.dim { opacity: 0.18; }
  .bar:hover, .bar:focus-within { opacity: 1; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .grow { flex: 1 1 auto; min-width: 0; }
  button {
    font: 500 0.8rem/1 var(--body); color: var(--ink); background: rgba(20, 13, 19, 0.5);
    border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--ember); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--ember); border-color: var(--ember); color: #24140a; }
  button.primary { background: var(--ember); border-color: var(--ember); color: #24140a; min-width: 74px; }
  .scrub { position: relative; height: 28px; }
  .scrub input { position: absolute; inset: 0; width: 100%; margin: 0; accent-color: var(--ember); background: transparent; }
  .chapters { position: absolute; left: 0; right: 0; top: -14px; height: 12px; font-size: 0.66rem; color: var(--muted); }
  .chapters span { position: absolute; transform: translateX(-2px); white-space: nowrap; letter-spacing: 0.06em; }
  .chapters span::before { content: ""; position: absolute; left: 0; top: 13px; width: 1px; height: 8px; background: var(--muted); opacity: 0.6; }
  #clock, #fps { font-variant-numeric: tabular-nums; font-size: 0.75rem; color: var(--muted); }
  #endcard { position: fixed; z-index: 4; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(10, 7, 10, 0.45); }
  #endcard .card { width: min(440px, 100%); background: var(--bar); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px;
                   backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #endcard h2 { margin: 0; font: 400 1.6rem/1.1 var(--display); }
  #endcard p { margin: 0; font-size: 0.85rem; line-height: 1.5; color: var(--muted); }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  .label { font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  @media (max-width: 560px) { .chapters span:nth-child(odd) { display: none; } #fps { display: none; } }
  @media (prefers-reduced-motion: reduce) { .bar { transition: none; } }
</style>

<div id="loading"><div>Toy Town<br><span id="loadmsg" style="font: 400 0.8rem var(--body); letter-spacing: 0.1em">Loading the set…</span></div></div>
<div id="title"><div><h1>Toy Town</h1><p>The Delivery</p></div></div>

<div class="bar" id="bar">
  <div class="scrub">
    <div class="chapters" id="chapters"></div>
    <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Sequence position">
  </div>
  <div class="row">
    <button class="primary" id="play" type="button">Pause</button>
    <button id="replay" type="button">Replay</button>
    <span id="clock">0:00 / 0:00</span>
    <span class="grow"></span>
    <button id="explore" type="button" aria-pressed="false">Explore</button>
    <button id="twos" type="button" aria-pressed="true">Stop-motion</button>
    <button id="fx" type="button" aria-pressed="true">Effects</button>
    <span id="fps"></span>
  </div>
</div>

<div id="endcard" hidden>
  <div class="card">
    <div class="label">End of sequence</div>
    <h2>The Delivery</h2>
    <p>Replay it, or explore the street yourself: drag to orbit, scroll to move closer. The camera stays out of the walls.</p>
    <div class="row">
      <button class="primary" id="end-replay" type="button">Replay</button>
      <button id="end-explore" type="button">Explore the street</button>
    </div>
    <div class="label">Measured on this device</div>
    <dl id="report"></dl>
    <div class="row"><button id="copy" type="button">Copy report</button><span id="copied" class="label"></span></div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const fmt = (s) => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  let api = null, dragging = false, idle = 0;
  window.TT_ASSETS = './assets/';
  window.TT_B64 = { 'toytown_seq.glb': './assets/toytown_seq.glb.txt', 'marine.glb': './assets/marine.glb.txt', 'gift.glb': './assets/gift.glb.txt' };
  function setPlayLabel() { $('play').textContent = api && api.playing ? 'Pause' : 'Play'; }
  function showReport(r) {
    const dl = $('report'); dl.innerHTML = '';
    if (!r) { dl.innerHTML = '<dt>Frames</dt><dd>Not enough playback to measure</dd>'; return; }
    const rows = [['Average', r.avgFps.toFixed(0) + ' fps'], ['Median frame', r.medianMs.toFixed(1) + ' ms'], ['95th percentile', r.p95Ms.toFixed(1) + ' ms'],
      ['Worst frame', r.worstMs.toFixed(0) + ' ms'], ['Frames over 33 ms', (r.slowFrames * 100).toFixed(1) + '%'], ['Frames sampled', r.frames],
      ['Resolution', r.pixels], ['Triangles drawn', (r.triangles / 1e6).toFixed(2) + 'M'], ['Effects', r.effects ? 'on' : 'off'], ['GPU', r.gpu]];
    for (const [k, v] of rows) { const dt = document.createElement('dt'); dt.textContent = k; const dd = document.createElement('dd'); dd.textContent = v; dl.append(dt, dd); }
    window.__lastReport = r;
  }
  window.TT_UI = {
    status(msg) { $('loadmsg').textContent = msg; },
    ready(a) {
      api = a; $('loading').remove();
      const ch = $('chapters');
      for (const [name, t] of a.chapters) { const s = document.createElement('span'); s.style.left = (t / a.duration * 100) + '%'; s.textContent = name; ch.appendChild(s); }
      setPlayLabel();
    },
    tick(t, end, dt) {
      if (!dragging) $('scrub').value = Math.round(t / end * 1000);
      $('clock').textContent = fmt(t) + ' / ' + fmt(end);
      $('title').style.opacity = api && !api.exploring ? Math.max(0, Math.min(1, (t - 0.6) / 1.0)) * Math.max(0, Math.min(1, (4.6 - t) / 1.0)) : 0;
      if (dt > 0) { idle += dt; $('fps').textContent = Math.round(1 / Math.max(dt, 1e-3)) + ' fps'; }
      $('bar').classList.toggle('dim', api && api.playing && idle > 3);
      setPlayLabel();
    },
    ended(report) { $('endcard').hidden = false; showReport(report); setPlayLabel(); },
  };
  addEventListener('pointermove', () => { idle = 0; });
  $('play').onclick = () => { if (!api) return; $('endcard').hidden = true; api.playing ? api.pause() : api.play(); setPlayLabel(); };
  const replay = () => { if (!api) return; $('endcard').hidden = true; api.replay(); $('explore').setAttribute('aria-pressed', 'false'); setPlayLabel(); };
  $('replay').onclick = replay; $('end-replay').onclick = replay;
  const explore = (on) => { if (!api) return; api.explore(on); $('explore').setAttribute('aria-pressed', on); if (on) $('endcard').hidden = true; setPlayLabel(); };
  $('explore').onclick = () => explore($('explore').getAttribute('aria-pressed') !== 'true');
  $('end-explore').onclick = () => explore(true);
  $('twos').onclick = () => { const on = $('twos').getAttribute('aria-pressed') !== 'true'; $('twos').setAttribute('aria-pressed', on); api && api.stopMotion(on); };
  $('fx').onclick = () => { const on = $('fx').getAttribute('aria-pressed') !== 'true'; $('fx').setAttribute('aria-pressed', on); api && api.effects(on); };
  $('scrub').addEventListener('input', (e) => { dragging = true; api && api.seek(e.target.value / 1000 * api.duration); });
  $('scrub').addEventListener('change', () => { dragging = false; });
  addEventListener('keydown', (e) => { if (e.code === 'Space' && e.target.tagName !== 'BUTTON') { e.preventDefault(); $('play').click(); } });
  $('copy').onclick = async () => {
    const txt = JSON.stringify(window.__lastReport || {}, null, 1);
    try { await navigator.clipboard.writeText(txt); $('copied').textContent = 'Copied'; } catch (err) { $('copied').textContent = 'Copy blocked: select the numbers above'; }
  };
</script>
<script type="module" src="./delivery.js"></script>
