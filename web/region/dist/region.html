<title>Toy Town Diorama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Layout: the board fills the screen; a quiet label top-left, the journey controls along the bottom,
     an optional measurement drawer on the right. */
  :root {
    --night: #0f0b12;
    --bar: rgba(20, 13, 19, 0.74);
    --ink: #f4e7d2;
    --muted: #c4b19b;
    --ember: #f0a54a;
    --line: rgba(244, 231, 210, 0.16);
    --display: "Marcellus", "Georgia", serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--night); color: var(--ink); font-family: var(--body); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100% !important; height: 100% !important; display: block; touch-action: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 9; background: var(--night);
             font: 400 1.2rem/1.5 var(--display); color: var(--muted); text-align: center; }
  .label { position: fixed; z-index: 3; top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
           pointer-events: none; text-shadow: 0 2px 18px rgba(0, 0, 0, 0.6); }
  .label h1 { margin: 0; font: 400 clamp(1.5rem, 3.4vw, 2.3rem)/1 var(--display); letter-spacing: 0.02em; }
  .label p { margin: 6px 0 0; font: 500 0.7rem/1 var(--body); letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
  .bar {
    position: fixed; z-index: 3; left: 0; right: 0; bottom: 0; display: grid; gap: 8px;
    padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background: linear-gradient(to top, var(--bar), rgba(20, 13, 19, 0));
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .grow { flex: 1 1 auto; }
  button {
    font: 500 0.8rem/1 var(--body); color: var(--ink); background: rgba(20, 13, 19, 0.55);
    border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--ember); }
  button:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--ember); border-color: var(--ember); color: #24140a; }
  button.primary { background: var(--ember); border-color: var(--ember); color: #24140a; font-weight: 600; padding: 10px 16px; }
  .small button { padding: 6px 10px; font-size: 0.74rem; }
  .tag { font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  #hud { font-variant-numeric: tabular-nums; font-size: 0.74rem; color: var(--muted); }
  #drawer { position: fixed; z-index: 4; top: 0; right: 0; bottom: 0; width: min(520px, 100%); overflow: auto;
            background: rgba(16, 10, 15, 0.92); border-left: 1px solid var(--line); padding: 18px max(16px, env(safe-area-inset-right, 0px)) 18px 16px;
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #drawer h2 { margin: 0 0 6px; font: 400 1.4rem/1.2 var(--display); }
  #drawer p { margin: 0 0 12px; font-size: 0.82rem; line-height: 1.5; color: var(--muted); }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 0.76rem; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  th { color: var(--muted); font-weight: 500; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 0.78rem; margin: 10px 0; }
  dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
  @media (max-width: 640px) { .hide-sm { display: none; } }
</style>

<div id="loading"><div>Toy Town<br><span id="loadmsg" style="font: 400 0.8rem var(--body); letter-spacing: 0.1em">Unpacking the diorama…</span></div></div>
<div class="label"><h1>Toy Town</h1><p id="where">The miniature map</p></div>

<div class="bar">
  <div class="row">
    <button class="primary" id="journey" type="button">Enter Toy Town</button>
    <span class="tag hide-sm">Views</span>
    <button id="v-map" type="button" aria-pressed="true">Map</button>
    <button id="v-approach" type="button" aria-pressed="false">Approach</button>
    <button id="v-village" type="button" aria-pressed="false">Village</button>
    <button id="explore" type="button" aria-pressed="false">Explore</button>
    <span class="grow"></span>
    <span id="hud"></span>
  </div>
  <div class="row small">
    <span class="tag">Rendering</span>
    <button id="o-post" type="button" aria-pressed="true">Effects</button>
    <button id="o-shadows" type="button" aria-pressed="true">Shadows</button>
    <button id="o-lod" type="button" aria-pressed="true">Level of detail</button>
    <button id="o-lamps" type="button" aria-pressed="false">Lamp shadows</button>
    <button id="o-twos" type="button" aria-pressed="true">Stop-motion</button>
    <button id="o-door" type="button">Toy shop door</button>
    <span class="grow"></span>
    <button id="measure" type="button">Measure performance</button>
  </div>
</div>

<aside id="drawer" hidden>
  <div class="row"><h2 class="grow">Performance on this device</h2><button id="close" type="button">Close</button></div>
  <p id="mstatus">Each view is held still and measured in six configurations, so the cost of every feature is visible. About a minute.</p>
  <div class="tablewrap"><table><thead><tr><th>View</th><th>Configuration</th><th>FPS</th><th>Avg ms</th><th>95th ms</th><th>Draws</th><th>Triangles</th></tr></thead><tbody id="rows"></tbody></table></div>
  <dl id="mem"></dl>
  <div class="row"><button id="copy" type="button">Copy results</button><span id="copied" class="tag"></span></div>
</aside>

<script>
  const $ = (id) => document.getElementById(id);
  let api = null, last = null;
  window.TT_ASSETS = './assets/';
  window.TT_B64 = Object.fromEntries(['static', 'static_lo', 'terrain', 'protos', 'protos_lo', 'marine'].map((n) => [n + '.glb', './assets/' + n + '.glb.txt']));
  const WHERE = { map: 'The miniature map', approach: 'Approaching Toy Town', village: 'Toy Town, the toy shop', flying: 'On the way…' };
  function pressView(name) { ['map', 'approach', 'village'].forEach((v) => $('v-' + v).setAttribute('aria-pressed', v === name)); }
  function setJourney() { $('journey').textContent = api && (api.mode === 'village' || api.mode === 'approach') ? 'Return to the map' : 'Enter Toy Town'; }
  window.TT_UI = {
    status(m) { $('loadmsg').textContent = m; },
    ready(a) { api = a; $('loading').remove(); },
    arrived(mode) { pressView(mode); setJourney(); },
    tick(s) {
      $('hud').textContent = `${Math.round(s.fps)} fps · ${s.calls} draws · ${(s.tris / 1e6).toFixed(1)}M tris`;
      $('where').textContent = WHERE[s.mode] || '';
    },
  };
  $('journey').onclick = () => { if (!api) return; $('explore').setAttribute('aria-pressed', 'false');
    if (api.mode === 'village' || api.mode === 'approach') api.returnToMap(); else api.enterTown(); pressView(''); setTimeout(setJourney, 50); };
  for (const v of ['map', 'approach', 'village']) $('v-' + v).onclick = () => { if (!api) return; api.goView(v); pressView(v); $('explore').setAttribute('aria-pressed', 'false'); setTimeout(setJourney, 50); };
  $('explore').onclick = () => { if (!api) return; const on = $('explore').getAttribute('aria-pressed') !== 'true'; $('explore').setAttribute('aria-pressed', on); api.explore(on); };
  const toggle = (id, key) => { $(id).onclick = () => { const on = $(id).getAttribute('aria-pressed') !== 'true'; $(id).setAttribute('aria-pressed', on); api && api.set(key, on); }; };
  toggle('o-post', 'post'); toggle('o-shadows', 'shadows'); toggle('o-lod', 'lod'); toggle('o-lamps', 'lampShadows');
  $('o-twos').onclick = () => { const on = $('o-twos').getAttribute('aria-pressed') !== 'true'; $('o-twos').setAttribute('aria-pressed', on); api && api.stopMotion(on); };
  $('o-door').onclick = () => api && api.toggleDoor();
  $('close').onclick = () => { $('drawer').hidden = true; };
  $('measure').onclick = async () => {
    if (!api) return;
    $('drawer').hidden = false; $('rows').innerHTML = ''; $('mem').innerHTML = '';
    $('mstatus').textContent = 'Measuring… keep this tab in front.';
    const add = (r) => {
      const tr = document.createElement('tr');
      for (const v of [r.view, r.config, r.fps, r.avgMs, r.p95Ms, r.drawCalls, (r.triangles / 1e6).toFixed(2) + 'M']) { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); }
      $('rows').appendChild(tr);
    };
    last = await api.measure(90, add);
    const m = last.memory;
    const rows = [['GPU', last.gpu], ['Canvas', last.canvas], ['Geometry buffers', m.geometryMB.toFixed(1) + ' MB'], ['Instance data', m.instancesMB.toFixed(2) + ' MB'],
      ['Render targets (approx.)', m.renderTargetsMB.toFixed(1) + ' MB'], ['Shadow maps', m.shadowMapsMB.toFixed(0) + ' MB'],
      ['JavaScript heap', m.jsHeapMB ? m.jsHeapMB.toFixed(0) + ' MB' : 'not reported by this browser'], ['Shader programs', m.programs]];
    for (const [k, v] of rows) { const dt = document.createElement('dt'); dt.textContent = k; const dd = document.createElement('dd'); dd.textContent = v; $('mem').append(dt, dd); }
    $('mstatus').textContent = 'Done. Frame times are measured with a GPU sync after every frame, so they are honest but slightly pessimistic.';
    api.goView('map'); pressView('map'); setJourney();
  };
  $('copy').onclick = async () => {
    try { await navigator.clipboard.writeText(JSON.stringify(last, null, 1)); $('copied').textContent = 'Copied'; }
    catch (e) { $('copied').textContent = 'Copy blocked: select the table instead'; }
  };
</script>
<script type="module" src="./region.js"></script>
