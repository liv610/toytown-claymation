<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--PAGE-START-->
<title>Storybook Pop-up Test</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  /* Layout: the storybook page fills the screen; a caption line above and one quiet control bar below.
     Single warm desk-at-night look, matching the illustrated page. */
  :root {
    --desk: #2a211b; --panel: rgba(36, 27, 21, 0.88); --ink: #f6ecda; --muted: #cdbfa9; --line: rgba(246, 236, 218, 0.18);
    --gold: #f2b85c; --holly: #c4372c; --holly-hi: #d8473a; --on-holly: #fff8ee;
    --display: "Fraunces", Georgia, serif; --body: "Atkinson Hyperlegible", system-ui, sans-serif;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--desk); color: var(--ink); font: 400 1rem/1.5 var(--body); overflow: hidden; }
  button, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100% !important; height: 100% !important; }
  .top { position: fixed; z-index: 3; inset: 0 0 auto; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline;
         padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
         background: linear-gradient(to bottom, rgba(42, 33, 27, 0.9), rgba(42, 33, 27, 0)); }
  .top strong { font: 600 1.15rem var(--display); }
  .badge { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #2a1606; background: var(--gold); padding: 3px 8px; border-radius: 6px; }
  .caption { position: fixed; z-index: 3; left: 50%; translate: -50% 0; top: calc(64px + env(safe-area-inset-top, 0px)); margin: 0; width: min(640px, calc(100% - 32px));
             text-align: center; font: 500 clamp(1.1rem, 2.4vw, 1.5rem)/1.3 var(--display); text-shadow: 0 2px 16px rgba(0, 0, 0, 0.75); }
  .bar { position: fixed; z-index: 3; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
         padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
         background: linear-gradient(to top, rgba(42, 33, 27, 0.92), rgba(42, 33, 27, 0)); }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 10px 16px; font-weight: 700; min-height: 44px; cursor: pointer; }
  .btn:hover { border-color: var(--gold); }
  .primary { background: var(--holly); border-color: var(--holly); color: var(--on-holly); }
  .primary:hover { background: var(--holly-hi); }
  .scrub { flex: 1 1 220px; display: flex; gap: 10px; align-items: center; min-width: 0; }
  .scrub input { flex: 1; min-width: 0; accent-color: var(--gold); }
  .scrub span, label { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
  select { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
  .pin { position: fixed; z-index: 2; left: 0; top: 0; translate: -50% -100%; border: 0; border-radius: 999px; padding: 9px 14px; font-weight: 700;
         background: var(--holly); color: var(--on-holly); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45); cursor: pointer; }
  .pin::after { content: ""; position: absolute; left: 50%; bottom: -7px; translate: -50% 0; border: 7px solid transparent; border-top-color: var(--holly); border-bottom: 0; }
  .status { position: fixed; inset: 0; display: grid; place-items: center; font: 500 1.2rem var(--display); color: var(--muted); }
  .note { position: fixed; z-index: 3; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(14px + env(safe-area-inset-top, 0px)); font-size: 0.78rem; color: var(--muted); max-width: 46ch; text-align: right; }
  @media (max-width: 700px) { .note { display: none; } .scrub span { display: none; } }
</style>

<div id="stage"></div>
<div id="status" class="status">Loading…</div>
<header class="top"><strong>Railroad of Hope</strong><span class="badge">Prototype · storybook transition test</span></header>
<p class="note">Placeholder illustrated map standing in for the folk-art national map. Fictional community.</p>
<p id="caption" class="caption" aria-live="polite"></p>
<button type="button" id="pin" class="pin">Visit Maple Hollow</button>
<div class="bar">
  <button type="button" id="visit" class="btn primary">Visit Maple Hollow</button>
  <button type="button" id="back" class="btn" hidden>Back to the map</button>
  <button type="button" id="pause" class="btn" hidden>Pause</button>
  <button type="button" id="resume" class="btn" hidden>Continue</button>
  <div class="scrub"><span>Scrub</span><input id="scrub" type="range" min="0" max="8" step="0.01" value="0" aria-label="Transition position"></div>
  <label for="speed">Speed</label>
  <select id="speed"><option value="1">1×</option><option value="0.5">½×</option><option value="0.25">¼×</option></select>
</div>
<!--PAGE-SCRIPTS-->
<script type="module" src="./dist/storybook.js"></script>
<!--PAGE-SCRIPTS-END-->
<!--PAGE-END-->
</head>
</html>
